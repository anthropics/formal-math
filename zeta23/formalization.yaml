automation:
  methods:
  - method: autonomous
    models:
    - Claude
    framework: ''
    prompting_notes: ''
  spend_usd: ''
  notes: 'The formalization was entirely automated: Claude produced all Lean code. Humans directed the
    project and reviewed its outputs; see the project blog post and AUDIT.md.'
fidelity:
  divergences: 'liminf bounds are rendered as: for all eps > 0 there is T0 such that for all T >= T0,
    (c - eps)*N <= X; the xi-prime proportion statements instead carry fixed decimal constants (no eps).
    ''Nontrivial zero'' is rendered as a zero with 0 < Re rho < 1. Windows are T1 < Im rho <= T2 (positive
    ordinates). Left sides count with multiplicity; N0*, N0^s, N_d count distinct points (the strong direction).
    The repository states the theorems at the paper''s constants; the weaker Cauchy-Schwarz-form variants
    that earlier revisions also certified are implied by these and are no longer separately stated. See
    comparator/README.md ''Reading notes''.'
review:
  status: author-verified
  reviewers:
  - Ralph Furman
  notes: 'Ralph Furman (paper author) read the main challenge module (comparator/Challenge.lean, the 17
    statements and their definition layer) and confirmed it matches the paper; the xi-prime challenge
    module is agent-reviewed. Recorded in AUDIT.md at the pinned commit: #print axioms checks for all
    23 statements (exactly [propext, Classical.choice, Quot.sound]) and comparator + NanoDa kernel runs
    for both configurations. The underlying paper was reviewed and endorsed by a human analytic number
    theorist, who also produced an independent condensed proof of the main result; journal peer review
    is pending. The Lean statements were additionally cold-read by Claude instances with no prior project
    context.'
alignment:
  namespace: ''
  statements:
  - source: 'Theorem A(i) (arXiv:2608.13637): at least 2/3 of the zeros are simple and on the critical
      line; Montgomery-Taylor window improves the constant to 2 - 1/c_MT = 0.67250...'
    lean: two_thirds_simple_on_critical_line (+_cumulative); montgomery_taylor_simple_on_critical_line_mult
      (+_cumulative)
    module: Challenge
    status: proved
  - source: 'Theorem A(ii): at least 5/6 of the zeros are distinct; Montgomery-Taylor window improves
      to (3 - 1/c_MT)/2 = 0.83625...'
    lean: five_sixths_distinct (+_cumulative); montgomery_taylor_distinct_mult (+_cumulative)
    module: Challenge
    status: proved
  - source: 'Theorem B: Theorem A holds verbatim for L(s, chi), chi a fixed primitive Dirichlet character
      (formalized for modulus q > 1)'
    lean: dirichlet_two_thirds_simple_on_critical_line; dirichlet_five_sixths_distinct; dirichlet_montgomery_taylor_simple_on_critical_line_mult;
      dirichlet_montgomery_taylor_distinct_mult
    module: Challenge
    status: proved
  - source: 'Companions recorded in the paper''s Appendix A: the on-the-line counts (N_0* >= N_0^s), at
      2/3 and at the Montgomery-Taylor constant, for zeta and L(s, chi)'
    lean: two_thirds_on_critical_line (+_cumulative); montgomery_taylor_on_critical_line; dirichlet_two_thirds_on_critical_line;
      dirichlet_montgomery_taylor_on_critical_line
    module: Challenge
    status: proved
  - source: 'Remark 7.1 (Zeros of xi''): at least 85.838% simple and on the critical line and 92.919%
      distinct (flat window); 86.864% and 93.432% (quartic window). The row also includes two supporting
      statements of the formalization not stated in the paper: every zero of xi'' lies in the open critical
      strip, and Re(xi''/xi) > 0 on Re s >= 1'
    lean: xiPrime_simple_zeros_on_critical_line (+_cumulative); xiPrime_simple_zeros_on_critical_line_quartic
      (+_cumulative); xiPrime_zeros_in_open_critical_strip; xiPrime_over_xi_re_pos
    module: Challenge.XiPrime
    status: proved
